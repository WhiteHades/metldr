[package]
name = "metldr-responses"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[workspace]

[dependencies]
metldr-browser-tools = { path = "../metldr-browser-tools" }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls"] }
serde_json = "=1.0.154"
tokio = { version = "=1.53.1", features = ["rt", "time", "macros"] }
