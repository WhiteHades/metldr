[package]
name = "metldr-extension-assets"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"

[workspace]

[dependencies]
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "rustls"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"

[lints.rust]
unsafe_code = "forbid"
